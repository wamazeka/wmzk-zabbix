      - type: JSONPATH
        parameters:
        - $.body.result.cpu_temp
      master_item:
        key: klipper.host_stats.get
      triggers:
      - uuid: 0292aea5420d40fc900ea91195e0afc4
        name: 'Klipper: Host temperature is high'
        priority: WARNING
        expression: last(/Klipper by HTTP/klipper.host.cpu_temp)>{$KLIPPER.HOST_TEMP.WARN}
        description: Moonraker host temperature above {$KLIPPER.HOST_TEMP.WARN}°C.
        tags:
        - tag: scope
          value: availability
        dependencies:
        - name: 'Klipper: Host temperature is critically high'
          expression: last(/Klipper by HTTP/klipper.host.cpu_temp)>{$KLIPPER.HOST_TEMP.CRIT}
      - uuid: abbb5db0643143ab81d2812b75c3ea60
        name: 'Klipper: Host temperature is critically high'
        priority: HIGH
        expression: last(/Klipper by HTTP/klipper.host.cpu_temp)>{$KLIPPER.HOST_TEMP.CRIT}
        description: Moonraker host temperature above {$KLIPPER.HOST_TEMP.CRIT}°C - throttling likely.
        tags:
        - tag: scope
          value: availability
